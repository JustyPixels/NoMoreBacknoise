name: Windows build and audio checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install pinned Rust
        run: rustup toolchain install 1.94.0 --profile minimal; rustup override set 1.94.0
      - name: Build and package
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Verify release engine timing and protocol
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Test shared driver ring in user mode
        shell: pwsh
        run: ./scripts/test-bridge.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: NoMoreBacknoise-windows-x64
          path: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
            artifacts/validation.json
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME artifacts/*.exe artifacts/*.zip artifacts/SHA256SUMS.txt artifacts/validation.json --title "NoMoreBacknoise++ $env:GITHUB_REF_NAME" --notes-file docs/RELEASE.md --prerelease
